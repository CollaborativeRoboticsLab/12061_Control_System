; =============================================================================
;  12061 Control Systems - linear inverted pendulum firmware
;  STM32F103C8T6 / register-level (no ST library) / VSCode + PlatformIO + ST-Link
;
;  HOW TO OPEN IT
;    In VSCode: File -> Open Folder, and pick THIS folder
;    (Control_System_lab_1), not its parent. PlatformIO detects the project
;    automatically. The very first time it will download the ARM toolchain,
;    which takes a few minutes.
;
;    Then use the buttons in the bottom status bar:
;      tick     Build
;      arrow    Upload
;      plug     Serial Monitor
;
;  NOTE: the parent folder (Control\lab) has a platformio.ini of its own.
;  That one belongs to the separate bluepill test board and builds src\main.c
;  at 9600 baud. It is a different project. Opening the parent folder by
;  mistake builds that instead of this, which is a common way to spend
;  twenty minutes wondering why nothing changed.
; =============================================================================

[platformio]
; The source root IS the project root.
; This option must live in the [platformio] section. Put it in [env:...] and
; PlatformIO warns "Ignore unknown configuration option" and then silently
; ignores it.
src_dir = .

[env:pendulum]
platform = ststm32
board     = genericSTM32F103C8      ; 64 KB Flash / 20 KB RAM

; ---- "framework" IS DELIBERATELY ABSENT ---------------------------------
;   This code is pure register access (RCC->APB2ENR, GPIOA->CRH,
;   TIM3->CCMR2, ...) and depends on no ST library at all. The CMSIS
;   headers it does need (stm32f10x.h, core_cm3.h) ship inside the project,
;   under SYSTEM/sys/. So there is nothing for a framework to provide, and
;   adding one makes things worse: its headers collide with the bundled
;   ones.
;
;   The price is that the startup file and the linker script have to be
;   supplied by hand. They are the two files in boot/.

board_build.ldscript = boot/STM32F103C8.ld

; ---- WHICH FILES GET COMPILED -------------------------------------------
;   Every .c in this project is needed; none is dead. So rather than list
;   them, list the folders and let PlatformIO's own build cache stay out.
build_src_filter =
    +<USER/>
    +<SYSTEM/>
    +<HARDWARE/>
    +<BALANCE/>
    +<boot/>

; ---- INCLUDE SEARCH PATHS -----------------------------------------------
;   One folder per driver module, so every folder needs its own -I. These
;   are the reason #include "oled.h" resolves; drop one and you get
;   "No such file or directory" for that module only.
build_flags =
    -I SYSTEM/sys
    -I SYSTEM/delay
    -I SYSTEM/usart
    -I HARDWARE/ADC
    -I HARDWARE/ENCODER
    -I HARDWARE/EXTI
    -I HARDWARE/KEY
    -I HARDWARE/LED
    -I HARDWARE/MOTOR
    -I HARDWARE/OLED
    -I HARDWARE/TIMER
    -I HARDWARE/DataScope_DP
    -I BALANCE/CHECK
    -I BALANCE/CONTROL
    -I BALANCE/show
    -D STM32F10X_MD                 ; medium-density part; same Define as Keil
    -Os                             ; optimise for size
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections               ; drop unreferenced functions from the image

; The sources were all converted to UTF-8, so -finput-charset=GBK is NOT
; needed here. The original WHEELTEC download was GBK and did need it. If
; you ever drop an original vendor file back into this project and the build
; fails on a comment, that is why.

; ---- ST-LINK UPLOAD AND DEBUG -------------------------------------------
upload_protocol  = stlink
debug_tool       = stlink
debug_init_break = tbreak main

; ---- SERIAL MONITOR -----------------------------------------------------
;   128000 is set by uart_init(72,128000) in the firmware. It is not a
;   typo and not a standard rate; leave it alone unless you change the
;   firmware too.
;
;   Out of reset the board transmits binary DataScope frames, so the
;   monitor fills with garbage characters. That is normal, not a fault.
;   Type PING and press Enter: the firmware mutes the binary stream on the
;   first valid ASCII command and everything after that is readable text.
;
;   Close the monitor before running MATLAB. Windows gives the COM port to
;   one program at a time, and a monitor left open is the usual cause of
;   "port exists but is busy".
; monitor_speed = 128000
monitor_speed = 112000
